    {
      title:'Algoritma & Logika', icon:'🧠', level:'Pemula', minutes:8,
      short:'Pahami urutan instruksi dan cara komputer menyelesaikan masalah.',
      goal:'Menyusun langkah logis untuk menyelesaikan suatu pekerjaan.',
      theory:'Algoritma adalah urutan langkah yang jelas untuk mencapai tujuan. Komputer menjalankan instruksi sesuai urutan yang kamu tulis. Pemrograman dimulai dari cara berpikir, bukan dari menghafal sintaks.',
      analogy:'Seperti SOP pelayanan tamu: menyapa, memeriksa reservasi, lalu menyerahkan kunci kamar. Jika urutannya salah, pelayanan jadi kacau.',
      steps:['Tentukan masalah yang ingin diselesaikan.','Susun langkah dari awal hingga akhir.','Uji apakah langkahnya menghasilkan tujuan yang diharapkan.'],
      code:'// Komputer membaca kode dari atas ke bawah\nconsole.log("1. Terima pelanggan");\nconsole.log("2. Periksa kebutuhan pelanggan");\nconsole.log("3. Berikan layanan");',
      task:'Ubah tiga langkah di atas menjadi SOP sederhana sesuai jurusanmu. Tambahkan satu langkah menggunakan console.log().',

      <section class="stat-grid" aria-label="Ringkasan kursus"><div class="stat"><strong>${lessons.length}</strong><span>Modul belajar</span></div><div class="stat"><strong>${state.completed.size}/${lessons.length}</strong><span>Materi dikuasai</span></div><div class="stat"><strong>${state.examBest===null?'—':state.examBest+'%'}</strong><span>Nilai terbaik ujian</span></div></section>
      <div class="section-heading"><div><h2>Peta Belajar Coding</h2><p>Mulai dari algoritma, lanjutkan ke JavaScript, dan buat mini web app.</p></div><span class="pill">Pilih modul ↓</span></div>
      <section class="module-grid">${lessons.map((l,i)=>`<button type="button" class="module" data-lesson="${i}"><div class="module-head"><div class="module-glyph">${l.icon}</div><span class="pill ${state.completed.has(i)?'done':''}">${state.completed.has(i)?'✓ Selesai':l.level}</span></div><h3>${String(i+1).padStart(2,'0')}. ${escapeHTML(l.title)}</h3><p>${escapeHTML(l.short)}</p><div class="module-foot">◷ ${l.minutes} menit · ${l.mode==='html'?'HTML + CSS + JS':'JavaScript'}</div></button>`).join('')}</section>
      <div class="tip-banner"><strong>💡 Panduan praktik:</strong> Pilih jurusan di pojok kanan atas untuk melihat contoh yang relevan. Tekan <strong>Jalankan Kode</strong> untuk mencoba, ubah isinya, lalu jawab pertanyaan pada akhir modul. Jawaban yang benar menandai modul sebagai selesai.</div>
      <p class="footer-line">KodeLab SMK · Belajar, praktik, perbaiki, ulangi · Dibuat untuk pembelajaran di kelas</p>`;
  }
  function lesson(){
    const l=lessons[state.index],i=state.index,track=contextFor(l),choice=state.answers[i];
    content.innerHTML=`
      <section class="lesson-header"><div><div class="eyebrow">Modul ${String(i+1).padStart(2,'0')} / ${lessons.length}</div><h1>${escapeHTML(l.title)}</h1><p>${escapeHTML(l.short)}</p><div class="lesson-meta"><span class="pill">◷ ${l.minutes} menit</span><span class="pill">${l.level}</span><span class="pill">🎯 ${escapeHTML(l.goal)}</span></div></div><div class="lesson-badge" aria-hidden="true">${l.icon}</div></section>
      <div class="two-col"><section class="card"><h2>📖 Apa itu?</h2><p>${escapeHTML(l.theory)}</p></section><section class="card"><h2>💡 Bayangkan seperti ini...</h2><div class="callout"><b>Contoh dalam kehidupan sehari-hari</b><p>${escapeHTML(l.analogy)}</p></div></section></div>
      <section class="card"><h2>🪜 3 Langkah Penting</h2><ol>${l.steps.map(s=>`<li>${escapeHTML(s)}</li>`).join('')}</ol></section>
      <section class="card editor-card" id="editorSection"><div class="editor-title"><h2>⌨️ Laboratorium Kode</h2><div class="editor-actions"><button class="ghost button-sm" data-action="copy">⧉ Salin</button><button class="ghost button-sm" data-action="reset-code">↺ Reset</button></div></div><div style="padding:13px 21px 10px"><span class="context-label">${track?`🎓 Contoh ${TRACKS[state.track]}: ${escapeHTML(track.desc)}`:l.mode==='html'?'🌐 Praktik web interaktif: HTML + CSS + JavaScript':'🌐 Contoh dasar JavaScript yang dapat kamu ubah sendiri'}</span><p style="font-size:12px;color:var(--muted);margin:0">Coba ubah kode, kemudian tekan tombol jalankan untuk melihat hasilnya.</p></div><div class="editor-main"><div class="line-nums" id="lineNumbers" aria-hidden="true">1</div><textarea class="code-input" id="codeEditor" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Editor kode" wrap="off"></textarea></div><div class="editor-bottom"><span class="run-hint">${l.mode==='html'?'Hasil muncul di pratinjau halaman':'Tip: Ctrl + Enter untuk menjalankan kode'}</span><button class="primary" data-action="run">▶ Jalankan Kode</button></div><div class="run-output"><div class="console-label">${l.mode==='html'?'▣ Pratinjau Aplikasi':'❯ Hasil Program'}</div>${l.mode==='html'?'<iframe id="previewFrame" title="Pratinjau aplikasi siswa" sandbox="allow-scripts" class="preview-frame"></iframe>':'<pre class="console-box" id="consoleOutput" aria-live="polite">Klik “Jalankan Kode” untuk melihat output...</pre>'}</div></section>
      <section class="card"><div class="task-layout"><div class="task-number">✦</div><div style="flex:1"><h2>Latihan Mandiri</h2><p>${escapeHTML(l.task)}</p><button class="secondary button-sm" data-action="hint">${state.hintOpen?'Sembunyikan Petunjuk':'💡 Lihat Petunjuk'}</button><div id="hintBody" class="hint-body ${state.hintOpen?'open':''}">${escapeHTML(l.hint)}</div></div></div></section>
      <section class="card" id="quizSection"><div class="eyebrow">Cek Pemahaman</div><h2>🧩 Satu pertanyaan untukmu</h2><p style="color:var(--text);font-weight:700;font-size:15px">${escapeHTML(l.quiz.q)}</p><div class="choices">${l.quiz.options.map((op,n)=>`<button class="choice ${choice===n?(n===l.quiz.answer?'correct':'wrong'):''}" data-answer="${n}" ${choice!==undefined?'disabled':''}><span class="letter">${letter(n)}</span><span>${escapeHTML(op)}</span></button>`).join('')}</div>${choice===undefined?'':`<div class="feedback ${choice===l.quiz.answer?'good':'bad'}">${choice===l.quiz.answer?'✓ Tepat! Materi ini sudah ditandai selesai.':'✕ Belum tepat. '+escapeHTML(l.quiz.why)}${choice===l.quiz.answer?'<div style="margin-top:4px;color:var(--muted)">'+escapeHTML(l.quiz.why)+'</div>':''}</div>${choice!==l.quiz.answer?'<button class="secondary button-sm" style="margin-top:11px" data-action="retry-quiz">↺ Coba Lagi</button>':''}`}</section>
      <nav class="lesson-navigation" aria-label="Pindah modul"><button class="secondary" ${i===0?'data-view="home"':`data-lesson="${i-1}"`}>← ${i===0?'Beranda':'Materi Sebelumnya'}</button><button class="primary" ${i===lessons.length-1?'data-view="exam"':`data-lesson="${i+1}"`}>${i===lessons.length-1?'Ujian Akhir':'Materi Selanjutnya'} →</button></nav><p class="footer-line">Progres akan tersimpan otomatis di browser yang sedang digunakan.</p>`;
    const editor=document.getElementById('codeEditor');editor.value=state.buffers[bufferKey()]??initialCode();updateLines();
    if(l.mode==='html')runCode();
  }
  function renderExam(){
    if(state.examFinished){const score=state.examAnswers.reduce((sum,a,i)=>sum+(a===examQuestions[i].a?1:0),0),percentage=Math.round(score/examQuestions.length*100);content.innerHTML=`<section class="card exam-result"><div style="font-size:48px">${percentage>=75?'🏆':'📚'}</div><div class="eyebrow">Hasil Ujian Akhir</div><h1>${percentage>=75?'Keren, kamu berhasil!':'Terus berlatih, kamu pasti bisa!'}</h1><strong>${percentage}%</strong><p>Kamu menjawab ${score} dari ${examQuestions.length} soal dengan benar. ${percentage>=75?'Selamat! Kamu telah menunjukkan pemahaman dasar pemrograman.':'Ulangi materi yang belum dikuasai, kemudian coba lagi.'}</p><div class="hero-actions" style="justify-content:center"><button class="primary" data-action="restart-exam">↺ Ulangi Ujian</button><button class="secondary" data-view="home">⌂ Kembali ke Beranda</button></div></section><section class="card"><h2>📝 Pembahasan Jawaban</h2>${examQuestions.map((q,i)=>`<div style="padding:13px 0;border-bottom:1px solid var(--border)"><div style="font-size:13px;font-weight:800">${i+1}. ${escapeHTML(q.q)}</div><p style="margin:5px 0">Jawabanmu: <b style="color:${state.examAnswers[i]===q.a?'var(--accent)':'var(--danger)'}">${escapeHTML(q.o[state.examAnswers[i]])}</b> · Kunci: ${escapeHTML(q.o[q.a])}</p><p>${escapeHTML(q.why)}</p></div>`).join('')}</section>`;return}
    const i=state.examIndex,q=examQuestions[i],answer=state.examAnswers[i];content.innerHTML=`<section class="lesson-header"><div><div class="eyebrow">Evaluasi Pembelajaran</div><h1>Ujian Akhir Coding</h1><p>Uji pemahaman fundamental coding. Ada ${examQuestions.length} soal pilihan ganda. Pilih jawaban terbaik sebelum melanjutkan.</p><div class="lesson-meta"><span class="pill">✎ ${examQuestions.length} soal</span><span class="pill">🎯 Target 75%</span></div></div><div class="lesson-badge">🏆</div></section><div class="card"><div class="exam-number">PERTANYAAN ${i+1} DARI ${examQuestions.length}</div><div class="exam-progress"><div style="width:${(i+1)/examQuestions.length*100}%"></div></div><h2 style="font-size:23px;margin-bottom:22px">${escapeHTML(q.q)}</h2><div class="choices">${q.o.map((x,n)=>`<button class="choice ${n===answer?'selected':''}" data-exam-answer="${n}"><span class="letter">${letter(n)}</span><span>${escapeHTML(x)}</span></button>`).join('')}</div><div class="lesson-navigation"><button class="secondary" data-action="exam-prev" ${i===0?'disabled':''}>← Sebelumnya</button><button class="primary" data-action="exam-next" ${answer===undefined?'disabled':''}>${i===examQuestions.length-1?'Lihat Hasil':'Berikutnya →'}</button></div></div><div class="tip-banner"><strong>Petunjuk:</strong> Jawab seluruh soal untuk melihat skor dan pembahasannya. Ujian dapat diulang kapan saja.</div>`;
  }
  function render(){stopWorker();renderNav();if(state.view==='home')home();else if(state.view==='lesson')lesson();else renderExam()}
  function go(view,index){state.view=view;if(view==='lesson'&&Number.isInteger(index)){state.index=Math.max(0,Math.min(index,lessons.length-1));state.hintOpen=false}closeSidebar();render();window.scrollTo({top:0,behavior:'instant'})}
  function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2300)}
  function updateLines(){const editor=document.getElementById('codeEditor'),lines=document.getElementById('lineNumbers');if(!editor||!lines)return;const n=Math.max(1,editor.value.split('\n').length);lines.textContent=Array.from({length:n},(_,i)=>i+1).join('\n');lines.scrollTop=editor.scrollTop}
  function stopWorker(){if(activeWorker){activeWorker.terminate();activeWorker=null}clearTimeout(workerTimer)}
  function runCode(){const editor=document.getElementById('codeEditor');if(!editor)return;const code=editor.value,l=lessons[state.index];state.buffers[bufferKey()]=code;
    if(l.mode==='html'){
      // sandbox mencegah kode dalam pratinjau memperoleh akses DOM halaman utama.
      const frame=document.getElementById('previewFrame');frame.srcdoc=code;toast('Pratinjau diperbarui');return;
    }
    const output=document.getElementById('consoleOutput');stopWorker();output.classList.remove('error');output.textContent='⏳ Menjalankan kode...';
    // Pekerja terpisah bisa dihentikan bila kode mengandung perulangan tanpa akhir.
    const workerScript=`self.onmessage=function(event){const lines=[];const stringify=(v)=>{if(typeof v==='string')return v;if(v===undefined)return 'undefined';try{return JSON.stringify(v)}catch{return String(v)}};const fakeConsole={log:(...args)=>lines.push(args.map(stringify).join(' ')),warn:(...args)=>lines.push('⚠ '+args.map(stringify).join(' ')),error:(...args)=>lines.push('✕ '+args.map(stringify).join(' '))};try{const fn=new Function('console','alert','prompt','confirm',event.data);fn(fakeConsole,()=>{throw Error('Gunakan console.log() untuk output.')},()=>{throw Error('Input prompt() tidak tersedia dalam laboratorium ini.')},()=>{throw Error('confirm() tidak tersedia.')});self.postMessage({ok:true,lines});}catch(err){self.postMessage({ok:false,lines,error:err.name+': '+err.message})}};`;
    let url=null;
    try{url=URL.createObjectURL(new Blob([workerScript],{type:'text/javascript'}));const worker=new Worker(url);activeWorker=worker;URL.revokeObjectURL(url);
      worker.onmessage=e=>{if(activeWorker!==worker)return;clearTimeout(workerTimer);activeWorker=null;const data=e.data;output.textContent=[...data.lines,data.ok?'':data.error].filter(Boolean).join('\n')||(data.ok?'✓ Kode berhasil dijalankan. Tambahkan console.log() untuk menampilkan hasil.':'Terjadi kesalahan.');output.classList.toggle('error',!data.ok);worker.terminate()};
      worker.onerror=e=>{if(activeWorker!==worker)return;stopWorker();output.textContent='Error: '+(e.message||'Gagal menjalankan kode.');output.classList.add('error')};
      worker.postMessage(code);workerTimer=setTimeout(()=>{if(activeWorker!==worker)return;stopWorker();output.textContent='⏱️ Eksekusi dihentikan setelah 3 detik. Periksa apakah ada loop tanpa akhir.';output.classList.add('error')},3000);
    }catch(err){if(url)URL.revokeObjectURL(url);output.textContent='Browser ini tidak mendukung editor JavaScript terisolasi: '+err.message;output.classList.add('error')}
  }
  function handleAnswer(index){const l=lessons[state.index];if(state.answers[state.index]!==undefined)return;state.answers[state.index]=index;if(index===l.quiz.answer){state.completed.add(state.index);toast('✓ Modul selesai!')}lesson();renderNav()}
  function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.add('hidden')}
  document.addEventListener('click',async e=>{
    const v=e.target.closest('[data-view]');if(v){go(v.dataset.view);return}
    const l=e.target.closest('[data-lesson]');if(l){go('lesson',Number(l.dataset.lesson));return}
    const ans=e.target.closest('[data-answer]');if(ans){handleAnswer(Number(ans.dataset.answer));return}
    const examAnswer=e.target.closest('[data-exam-answer]');if(examAnswer){state.examAnswers[state.examIndex]=Number(examAnswer.dataset.examAnswer);renderExam();return}
    const action=e.target.closest('[data-action]');if(!action)return;
    switch(action.dataset.action){
      case 'run':runCode();break;
      case 'reset-code':state.buffers[bufferKey()]=initialCode();document.getElementById('codeEditor').value=initialCode();updateLines();if(lessons[state.index].mode==='html')runCode();else{document.getElementById('consoleOutput').textContent='Kode dikembalikan ke contoh awal. Klik Jalankan Kode.'}toast('Kode contoh dipulihkan');break;
      case 'copy':{const text=document.getElementById('codeEditor').value;try{await navigator.clipboard.writeText(text);toast('Kode disalin ke clipboard')}catch{const field=document.getElementById('codeEditor');field.focus();field.select();toast('Pilih teks kode, lalu tekan Ctrl+C')}break}
      case 'hint':state.hintOpen=!state.hintOpen;document.getElementById('hintBody').classList.toggle('open',state.hintOpen);action.textContent=state.hintOpen?'Sembunyikan Petunjuk':'💡 Lihat Petunjuk';break;
      case 'retry-quiz':delete state.answers[state.index];lesson();break;
      case 'exam-prev':if(state.examIndex>0){state.examIndex--;renderExam()}break;
      case 'exam-next':if(state.examAnswers[state.examIndex]===undefined)break;if(state.examIndex<examQuestions.length-1){state.examIndex++;renderExam()}else{state.examFinished=true;const score=Math.round(state.examAnswers.reduce((total,a,i)=>total+(a===examQuestions[i].a?1:0),0)/examQuestions.length*100);state.examBest=Math.max(state.examBest??0,score);save('kodelab_exam_best',state.examBest);render();window.scrollTo(0,0)}break;
      case 'restart-exam':state.examFinished=false;state.examIndex=0;state.examAnswers=[];renderExam();window.scrollTo(0,0);break;
    }
  });
  document.addEventListener('input',e=>{if(e.target.id==='codeEditor'){state.buffers[bufferKey()]=e.target.value;updateLines()}});
  document.addEventListener('scroll',e=>{if(e.target.id==='codeEditor')updateLines()},true);
  document.addEventListener('keydown',e=>{
    if(e.target.id==='codeEditor'&&e.key==='Tab'){e.preventDefault();const ed=e.target,start=ed.selectionStart,end=ed.selectionEnd;ed.setRangeText('  ',start,end,'end');state.buffers[bufferKey()]=ed.value;updateLines()}
    if(e.target.id==='codeEditor'&&e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();runCode()}
    if(e.key==='Escape')closeSidebar();
  });
  document.getElementById('trackSelect').addEventListener('change',e=>{state.track=e.target.value;save('kodelab_track',state.track);render();toast('Konteks: '+TRACKS[state.track])});
  document.getElementById('searchLessons').addEventListener('input',renderNav);
  document.getElementById('themeToggle').addEventListener('click',()=>{state.theme=state.theme==='dark'?'light':'dark';save('kodelab_theme',state.theme);document.body.classList.toggle('light',state.theme==='light');document.getElementById('themeToggle').textContent=state.theme==='light'?'☾':'☀'});
  document.getElementById('menuToggle').addEventListener('click',()=>{document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('hidden')});
  document.getElementById('overlay').addEventListener('click',closeSidebar);
  render();
  </script>
</body>
</html>
